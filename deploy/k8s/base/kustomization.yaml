apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgequeue

resources:
  - namespace.yaml
  - redis.yaml
  - postgres.yaml
  - worker.yaml
  - gateway.yaml
  - apiserver.yaml
  - web.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: forgequeue-config
    literals:
      - FORGEQUEUE_WORKER_CONCURRENCY=4
      - FORGEQUEUE_BATCH_SIZE=1
      - FORGEQUEUE_METRICS_ADDR=:9100
      - FORGEQUEUE_API_ADDR=:8080
