apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in: apply these only after kube-prometheus-stack is installed, because
# ServiceMonitor depends on the monitoring.coreos.com CRDs.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace
#   kubectl apply -k deploy/k8s/observability

namespace: forgequeue

resources:
  - servicemonitor.yaml
