# Logical backup of the durable journal. This is the pattern, not full DR:
# a PVC-backed dump protects against operator error and logical corruption,
# but lives on the same cluster as the data. For real disaster recovery point
# the dump destination at object storage (S3/GCS) or ship the base volume
# snapshots off-cluster. WAL archiving (pgBackRest/WAL-G) is the step beyond
# this that gives point-in-time recovery.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: forgequeue
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: forgequeue
spec:
  schedule: "0 3 * * *" # 03:00 daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: forgequeue
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: postgres:16.15
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: forgequeue-secrets
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -eu
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backups/forgequeue-${stamp}.dump"
                  pg_dump -h postgres -U forgequeue -d forgequeue \
                    --format=custom --no-owner --no-privileges -f "$out"
                  echo "wrote $out"
                  # Retain the 7 most recent dumps.
                  ls -1t /backups/forgequeue-*.dump | tail -n +8 | xargs -r rm -f
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup
            - name: tmp
              emptyDir: {}
