apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgequeue

resources:
  - namespace.yaml
  - redis.yaml
  - postgres.yaml
  - backup.yaml
  - worker.yaml
  - gateway.yaml
  - apiserver.yaml
  - web.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: forgequeue-config
    literals:
      - FORGEQUEUE_WORKER_CONCURRENCY=4
      - FORGEQUEUE_BATCH_SIZE=1
      - FORGEQUEUE_METRICS_ADDR=:9100
      - FORGEQUEUE_API_ADDR=:8080
      # TLS mode for the Postgres connection. "disable" fits the bundled,
      # in-cluster Postgres (loopback pod network). Override to "require" or
      # "verify-full" in an overlay that points at a managed, TLS-terminating
      # Postgres (close FORGEQUEUE_PG_DSN accordingly).
      - FORGEQUEUE_PG_SSLMODE=disable
      # Browser origins allowed to call the API with credentials. Empty means
      # same-origin only (the ingress serves the console and /api together),
      # which is the production shape. Dev sets the web origin explicitly.
      - FORGEQUEUE_CORS_ORIGINS=
