apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/part-of: forgequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiserver
        app.kubernetes.io/part-of: forgequeue
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 1; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      containers:
        - name: apiserver
          image: forgequeue/apiserver:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: forgequeue-config
            - secretRef:
                name: forgequeue-secrets
          env:
            - name: FORGEQUEUE_REDIS_ADDR
              value: redis:6379
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/part-of: forgequeue
spec:
  selector:
    app.kubernetes.io/name: apiserver
  ports:
    - name: http
      port: 8080
      targetPort: http
