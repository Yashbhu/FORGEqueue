apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: forgequeue
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: forgequeue
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apiserver
  labels:
    app.kubernetes.io/part-of: forgequeue
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apiserver
