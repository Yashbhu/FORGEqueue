# Optional. Add this file to overlays/prod/kustomization.yaml's `patches:` list
# only if your GHCR packages are private. Create the pull secret first:
#
#   kubectl -n forgequeue create secret docker-registry ghcr-cred \
#     --docker-server=ghcr.io \
#     --docker-username=<user> \
#     --docker-password=<token>
#
# A referenced-but-missing imagePullSecret makes every pod ErrImagePull, so
# this is opt-in rather than on by default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-cred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-cred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-cred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-cred
