apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: forgequeue
spec:
  serviceName: postgres
  replicas: 1
  # Keep the journal volume on delete and on scale-down so a StatefulSet
  # change can never silently orphan or drop the only durable copy.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: forgequeue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.15
          env:
            - name: POSTGRES_DB
              value: forgequeue
            - name: POSTGRES_USER
              value: forgequeue
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgequeue-secrets
                  key: POSTGRES_PASSWORD
            # Keep the cluster data in a subdir so the volume root can hold the
            # lost+found directory some CSI drivers create.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          # A generous startupProbe absorbs first-boot initdb and crash
          # recovery. Liveness only begins once the database accepts
          # connections, so a slow disk cannot trigger a restart loop that
          # leaves PGDATA half-initialized.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "forgequeue", "-d", "forgequeue"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forgequeue", "-d", "forgequeue"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "forgequeue", "-d", "forgequeue"]
            periodSeconds: 20
          resources:
            # requests == limits gives Postgres Guaranteed QoS, so node memory
            # pressure evicts best-effort pods instead of the journal.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: forgequeue
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: forgequeue
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
