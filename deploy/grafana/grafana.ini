; Grafana settings ForgeQueue needs.
;
; The stock /opt/homebrew/etc/grafana/grafana.ini is left alone. This file
; only pins the bits that have to line up with deploy/observability.sh:
; where provisioning is read from, and where the UI listens.
;
; Provisioning and data paths are passed in on the command line as
; cfg:default.paths.* rather than written here, so no absolute path to this
; checkout is baked into a tracked file.

[server]
; 3000 is Grafana's default; stated explicitly so the run script and this
; file cannot drift apart.
http_port = 3000

[auth.anonymous]
; The demo has no login. Anyone who can reach the port gets the dashboards.
; Do not carry this into anything shared.
enabled = true
org_role = Viewer

[auth.basic]
enabled = false

[users]
allow_sign_up = false

[dashboards]
; Show the "Dashboard" folder in the sidebar, so the provisioned JSON is
; discoverable without knowing its name.
min_refresh_interval = 5s

[log]
; Warn is plenty; Grafana is very chatty at info.
level = warn