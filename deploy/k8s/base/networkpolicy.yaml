# Redis holds live queue state, so only the queue services may reach it. This
# is the network half of the boundary; the gRPC gateway adds token auth on top.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    app.kubernetes.io/part-of: forgequeue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["apiserver", "gateway", "worker"]
      ports:
        - protocol: TCP
          port: 6379
---
# The durable journal. Only the gateway (writes) and workers (follow state,
# reconcile) connect to Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: forgequeue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["gateway", "worker"]
      ports:
        - protocol: TCP
          port: 5432
